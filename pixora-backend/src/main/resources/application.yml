server:
  port: ${PORT:8080}

spring:
  application:
    name: pixora-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

fal:
  api-key: ${FAL_AI_API_KEY:}

logging:
  level:
    root: INFO
    com.pixora.backend: DEBUG
