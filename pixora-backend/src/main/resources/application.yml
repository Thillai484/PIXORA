server:
  port: ${PORT:8080}

spring:
  application:
    name: pixora-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:pixoradb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:${DB_USER:sa}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
        preparedStatementCacheSizeMiB: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:pixora-9223f}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-image}

fal:
  api-key: ${FAL_AI_API_KEY:}

logging:
  level:
    root: INFO
    com.pixora.backend: INFO
